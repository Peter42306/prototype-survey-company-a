body,h1,h2,h3,h4,h5 {font-family: "Poppins", sans-serif}
body {font-size: 16px;}
body, html {
  height: 100%;
  color: #777;
  line-height: 1.8;

/* Create a Parallax Effect */
.bgimg-1 {
  background-attachment: scroll;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.bgimg-2, .bgimg-3, .bgimg-4 {
  background-attachment: fixed;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

/* First image (Logo. Full height) */
.bgimg-1 {
  background-image: url('/images/20260613_064510_from_deck.jpg');
  min-height: 50%;
}

/* Second image (Portfolio) */
.bgimg-2 {
  background-image: url("/images-gallery/");
  min-height: 300px;
}

/* Third image (Contact) */
.bgimg-3 {
  background-image: url("/images/20260613_080337_another_cape.jpg");
  min-height: 300px;
}

/* 4th image (Contact) */
.bgimg-4 {
  background-image: url("/images/20260613_064419_accomodation.jpg");
  min-height: 300px;
}


.w3-wide {letter-spacing: 10px;}
.w3-hover-opacity {cursor: pointer;}

#modal01 .w3-modal-content {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#img01 {
    display: block;
    max-width: 98vw;
    max-height: 82vh;    
}

.gallery-filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

.gallery-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
}

html {
    scroll-behavior: smooth;
}

<script>

var galleryImages;
var currentIndex = 0;

window.onload = function () {
    galleryImages =
        document.querySelectorAll(".gallery-image");
}

function onClick(element) {

    document.getElementById("modal01").style.display = "block";

    document.getElementById("img01").src = element.src;

    document.getElementById("caption").innerHTML =
        element.alt;

    for (var i = 0; i < galleryImages.length; i++) {

        if (galleryImages[i] === element) {

            currentIndex = i;
            break;
        }
    }
}

function nextImage(event) {

    event.stopPropagation();

    currentIndex++;

    if (currentIndex >= galleryImages.length) {
        currentIndex = 0;
    }

    showImage();
}

function prevImage(event) {

    event.stopPropagation();

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = galleryImages.length - 1;
    }

    showImage();
}

function showImage() {

    document.getElementById("img01").src =
        galleryImages[currentIndex].src;

    document.getElementById("caption").innerHTML =
        galleryImages[currentIndex].alt;
}

document.addEventListener("keydown", function(event) {

    if (document.getElementById("modal01").style.display !== "block")
        return;

    if (event.key === "ArrowLeft")
        prevImage(event);

    if (event.key === "ArrowRight")
        nextImage(event);

    if (event.key === "Escape")
        document.getElementById("modal01").style.display = "none";
});

// Change style of navbar on scroll
window.onscroll = function() {myFunction()};
function myFunction() {
    var navbar = document.getElementById("myNavbar");
    if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
        navbar.className = "w3-bar" + " w3-card" + " w3-animate-top" + " w3-white";
    } else {
        navbar.className = navbar.className.replace(" w3-card w3-animate-top w3-white", "");
    }
}

// Used to toggle the menu on small screens when clicking on the menu button
function toggleFunction() {
    var x = document.getElementById("navDemo");
    if (x.className.indexOf("w3-show") == -1) {
        x.className += " w3-show";
    } else {
        x.className = x.className.replace(" w3-show", "");
    }
}

// Used to choose service photo
function filterServices(serviceName){
    var services = document.getElementsByClassName("gallery-service");

    for (var i=0; i < services.length; i++){
        if (serviceName === "all" || services[i].classList.contains(serviceName)){
            services[i].style.display = "block";
        } else {
            services[i].style.display = "none"
        }
    }

    document.getElementById("gallery-section").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

</script>
